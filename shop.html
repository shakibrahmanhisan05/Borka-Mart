<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop the Collection — Borka Mart</title>
  <meta name="description" content="Shop premium borkas, abayas, butterfly farashas, kimonos and cape jilbabs from Borka Mart. Cash on delivery across Bangladesh.">
  <meta name="theme-color" content="#123a33">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Borka Mart — Modest Luxury">
  <meta property="og:description" content="Premium borkas &amp; abayas designed in Dhaka. The Eid Collection 2026 is live.">
  <meta property="og:image" content="assets/img/site/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/site/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/site/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Hind+Siliguri:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
  <div class="loader" id="loader"><svg class="loader__mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#123a33"/><path d="M12.5 31V18.5a7.5 7.5 0 0 1 15 0V31" fill="none" stroke="#d4b06a" stroke-width="1.5"/><path d="M21.8 13.6a4.3 4.3 0 1 0 0 8.2 5.2 5.2 0 1 1 0-8.2Z" fill="#d4b06a"/></svg></div>
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span id="crumb-cur">Shop</span></nav>
        <h1 id="shop-title">The <em>Collection</em></h1>
        <p id="shop-sub">Borkas, abayas &amp; jilbabs designed in Dhaka.</p>
      </div>
    </section>

    <div class="toolbar">
      <div class="container toolbar__row">
        <button class="filter-btn" id="filter-open"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg>Filter <i id="filter-n" hidden>0</i></button>
        <div class="chips" id="cat-chips"></div>
      </div>
    </div>

    <div class="container shop-layout">
      <aside class="sheet as-sidebar" id="filters" aria-label="Filters">
        <div class="sheet__grip"></div>
        <div class="drawer__head"><h2 class="drawer__title">Filter</h2><button class="icon-btn" data-action="close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div class="drawer__body">
          <div class="filter-group">
            <h4>Price</h4>
            <div class="range-row"><span>Up to</span><span id="price-val"></span></div>
            <input type="range" id="price" min="2500" max="9000" step="250">
          </div>
          <div class="filter-group">
            <h4>Colour</h4>
            <div class="color-filter" id="color-filter"></div>
          </div>
          <div class="filter-group">
            <h4>Highlights</h4>
            <div class="chips" id="tag-filter">
              <button class="chip" data-tag="new">New In</button>
              <button class="chip" data-tag="best">Bestsellers</button>
              <button class="chip" data-tag="sale">On Sale</button>
            </div>
          </div>
          <div class="filter-group" style="border:0">
            <button class="link-btn" id="clear-filters">Clear all filters</button>
          </div>
        </div>
        <div class="drawer__foot"><button class="btn btn--block" data-action="close" id="show-results">Show results</button></div>
      </aside>

      <div>
        <div class="result-bar">
          <span id="result-count"></span>
          <label class="select"><span class="sr-only">Sort by</span>
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="new">Newest</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </label>
        </div>
        <div class="grid" id="shop-grid"></div>
      </div>
    </div>
    <div class="section--tight"></div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
