  <meta property="og:type" content="website">
  <meta property="og:title" content="Borka Mart — Modest Luxury">
  <meta property="og:description" content="Premium borkas &amp; abayas designed in Dhaka. The Eid Collection 2026 is live.">
  <meta property="og:image" content="assets/img/site/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="apple-touch-icon" href="assets/img/site/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="track">
  <div class="loader" id="loader"><svg class="loader__mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#123a33"/><path d="M12.5 31V18.5a7.5 7.5 0 0 1 15 0V31" fill="none" stroke="#d4b06a" stroke-width="1.5"/><path d="M21.8 13.6a4.3 4.3 0 1 0 0 8.2 5.2 5.2 0 1 1 0-8.2Z" fill="#d4b06a"/></svg></div>
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>Track Order</span></nav>
        <h1>Track Your <em>Order</em></h1>
        <p>Enter your order number to see its journey to you.</p>
      </div>
    </section>
    <section class="section" style="padding-top:20px">
      <div class="container" style="max-width:640px">
        <form class="panel" id="track-form" novalidate>
          <div class="field"><label for="t-id">Order number</label><input id="t-id" placeholder="e.g. BM1234567" autocomplete="off" style="text-transform:uppercase"><span class="err">We couldn't find that order. Please check the number.</span></div>
          <button class="btn btn--block" type="submit">Track Order</button>
        </form>
        <div id="track-result" class="mt-32"></div>
        <div id="my-orders" class="mt-32"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
