<head>

  <meta name="description" content="Premium borka and abaya by Borka Mart — hand-finished details, luxurious fabrics, cash on delivery.">
  <meta name="theme-color" content="#123a33">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Borka Mart — Modest Luxury">
  <meta property="og:description" content="Premium borkas &amp; abayas designed in Dhaka. The Eid Collection 2026 is live.">
  <meta property="og:image" content="assets/img/site/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Hind+Siliguri:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="product">
  <div class="loader" id="loader"><svg class="loader__mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#123a33"/><path d="M12.5 31V18.5a7.5 7.5 0 0 1 15 0V31" fill="none" stroke="#d4b06a" stroke-width="1.5"/><path d="M21.8 13.6a4.3 4.3 0 1 0 0 8.2 5.2 5.2 0 1 1 0-8.2Z" fill="#d4b06a"/></svg></div>
  <div id="site-header"></div>

  <main>
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb" style="justify-content:flex-start;padding-top:16px"><a href="index.html">Home</a><span><a href="shop.html" id="crumb-cat">Shop</a></span><span id="crumb-name"></span></nav>
      <div class="pdp" id="pdp"></div>
    </div>

    <section class="section" id="reviews-sec">
      <div class="container">
        <div class="sec-head">
          <span class="eyebrow both">Reviews</span>
          <h2>What Customers <em>Say</em></h2>
        </div>
        <div id="pdp-reviews"></div>
      </div>
    </section>

    <section class="section section--cream">
      <div class="container">
        <div class="sec-head sec-head--row">
          <div><span class="eyebrow">Complete the wardrobe</span><h2>You May Also <em>Love</em></h2></div>
          <a class="view-all" href="shop.html">Shop all <svg class="icon" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="grid" id="related"></div>
      </div>
    </section>

    <section class="section" id="recent-sec" hidden>
      <div class="container">
        <div class="sec-head"><span class="eyebrow both">Your journey</span><h2>Recently <em>Viewed</em></h2></div>
        <div class="grid" id="recent"></div>
      </div>
    </section>

    <div class="sticky-buy" id="sticky-buy"></div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/product.js"></script>
